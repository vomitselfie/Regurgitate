[package]
name = "regurgitate"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Encrypted local procedural memory for AI agents"
repository = "https://github.com/vomitselfie/Regurgitate"

[dependencies]
anyhow = "1.0"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.4"
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
keyring = { version = "4.1", default-features = false, features = ["v1"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.0"
toml_edit = "0.25"
uuid = { version = "1.0", features = ["serde", "v4", "v5"] }
zeroize = { version = "1.8", features = ["derive"] }
