name: CI and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: regurgitate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.88.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the minimum supported Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default "$RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Validate manifest with AoE
        run: |
          set -euo pipefail
          aoe_fixture="$(mktemp -d "$RUNNER_TEMP/aoe-compat.XXXXXX")"
          curl --fail --show-error --silent --location \
            https://github.com/agent-of-empires/agent-of-empires/releases/download/v1.15.3/aoe-linux-amd64.tar.gz \
            --output "$aoe_fixture/aoe.tar.gz"
          echo "050a7a7726967656c02faf887dad50f977d6b447c751db440079ba3df6be7623  $aoe_fixture/aoe.tar.gz" | sha256sum --check
          tar -xzf "$aoe_fixture/aoe.tar.gz" -C "$aoe_fixture"
          bash scripts/test-aoe-manifest.sh "$aoe_fixture/aoe-linux-amd64"

      - name: Verify release packaging
        run: |
          set -euo pipefail
          bash -n scripts/package-release.sh
          bash -n scripts/test-install.sh
          sh -n install.sh
          cargo build --locked

          scripts/test-install.sh target/debug/regurgitate

          package_dist="$RUNNER_TEMP/regurgitate-package"
          REGURGITATE_DIST_DIR="$package_dist" \
            scripts/package-release.sh linux-x86_64 target/debug/regurgitate
          REGURGITATE_DIST_DIR="$package_dist" \
            scripts/verify-release-package.sh linux-x86_64

  build-release:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            binary_arch: x86_64
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            platform: macos-aarch64
            binary_arch: arm64
          - runner: macos-15
            rust_target: x86_64-apple-darwin
            platform: macos-x86_64
            binary_arch: x86_64
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install the release Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.rust_target }}"

      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary="target/${{ matrix.rust_target }}/release/regurgitate"
          if readelf -l "$binary" | grep -Fq INTERP; then
            echo "release binary is dynamically linked" >&2
            exit 1
          fi

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          binary="target/${{ matrix.rust_target }}/release/regurgitate"
          actual="$(lipo -archs "$binary")"
          test "$actual" = "${{ matrix.binary_arch }}"

      - name: Package and smoke-test release
        run: |
          set -euo pipefail
          scripts/package-release.sh \
            "${{ matrix.platform }}" \
            "target/${{ matrix.rust_target }}/release/regurgitate"
          scripts/verify-release-package.sh "${{ matrix.platform }}"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regurgitate-${{ matrix.platform }}
          path: dist/regurgitate-v*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Determine release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_id="$(cargo pkgid -p regurgitate)"
          version="${package_id##*@}"
          if [[ "$version" == "$package_id" ]]; then
            echo "could not determine the Regurgitate package version" >&2
            exit 1
          fi
          tag="v${version}"
          required_assets=(
            "regurgitate-${tag}-linux-x86_64.tar.gz"
            "regurgitate-${tag}-macos-aarch64.tar.gz"
            "regurgitate-${tag}-macos-x86_64.tar.gz"
            "install.sh"
            "SHA256SUMS"
          )
          tag_commit="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" || true)"

          mode=create
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ -z "$tag_commit" ]]; then
              echo "release $tag exists but its tag is unavailable" >&2
              exit 1
            fi

            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            complete=true
            for required in "${required_assets[@]}"; do
              if ! grep -Fxq "$required" <<<"$assets"; then
                complete=false
              fi
            done

            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              if [[ "$complete" == false ]]; then
                echo "release $tag belongs to another commit and is missing required assets" >&2
                exit 1
              fi
              mode=skip
            elif [[ "$complete" == true ]]; then
              mode=skip
            else
              mode=repair
            fi
          elif [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "tag $tag already points to another commit but has no release" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Verify release set and generate checksums
        if: steps.release.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          archives=(
            "dist/regurgitate-${tag}-linux-x86_64.tar.gz"
            "dist/regurgitate-${tag}-macos-aarch64.tar.gz"
            "dist/regurgitate-${tag}-macos-x86_64.tar.gz"
          )
          for archive in "${archives[@]}"; do
            test -f "$archive"
          done
          install -m 0755 install.sh dist/install.sh
          (
            cd dist
            sha256sum \
              "regurgitate-${tag}-linux-x86_64.tar.gz" \
              "regurgitate-${tag}-macos-aarch64.tar.gz" \
              "regurgitate-${tag}-macos-x86_64.tar.gz" \
              install.sh \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Publish GitHub release
        if: steps.release.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          archives=(
            "dist/regurgitate-${tag}-linux-x86_64.tar.gz"
            "dist/regurgitate-${tag}-macos-aarch64.tar.gz"
            "dist/regurgitate-${tag}-macos-x86_64.tar.gz"
            "dist/install.sh"
          )

          if [[ "${{ steps.release.outputs.mode }}" == repair ]]; then
            gh release upload "$tag" "${archives[@]}" dist/SHA256SUMS \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          release_flags=()
          if [[ "${{ steps.release.outputs.version }}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$tag" "${archives[@]}" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Regurgitate $tag" \
            --generate-notes \
            "${release_flags[@]}"

      - name: Report existing release
        if: steps.release.outputs.mode == 'skip'
        run: echo "${{ steps.release.outputs.tag }} is already released; bump Cargo.toml to publish another version."
