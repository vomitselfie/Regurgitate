id = "vomitselfie.regurgitate"
name = "Regurgitate"
version = "0.10.2"
api_version = 12
aoe_version = ">=1.14.0, <2.0.0"
description = "Private, encrypted procedural memory for AI coding agents."
icon = "brain-circuit"

capabilities = ["runtime.worker", "fs.read", "fs.write"]

[[commands]]
id = "status"
title = "Regurgitate: status"
description = "Inspect aggregate Regurgitate readiness without creating local state."

[[commands]]
id = "refresh"
title = "Regurgitate: refresh"
description = "Refresh the aggregate Regurgitate health shown by Agent of Empires."

[[commands]]
id = "setup-codex"
title = "Regurgitate: set up Codex"
description = "Install the Codex recording hook and recall skill without replacing existing settings."

[[commands]]
id = "setup-claude"
title = "Regurgitate: set up Claude Code"
description = "Install the Claude Code recording hooks and recall skill without replacing existing settings."

[[ui]]
slot = "status-bar"
id = "health"

[[ui]]
slot = "settings-page"
id = "overview"

[runtime]
kind = "release-binary"
asset = "regurgitate-v${version}-${os}-${arch}.tar.gz"
bin = "regurgitate"
